name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system audio deps
        # macroquad's "audio" feature links quad-snd against ALSA on Linux.
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        # -D warnings fails on any lint; dead_code is allowed while the core
        # has no frontend wiring it up yet (its methods look "unused").
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all
